name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm install
      - run: npm run lint --workspace=packages/backend || true
      - run: npm test --workspace=packages/backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/tsidat_test
          JWT_ACCESS_SECRET: test_secret
          JWT_REFRESH_SECRET: test_secret_2

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm install
      - run: npm run build --workspace=packages/web
