version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: tsidat-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./packages/backend
    container_name: tsidat-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://mongo:27017/tsidat
    env_file:
      - ./packages/backend/.env

volumes:
  mongo-data:
